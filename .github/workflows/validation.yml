name: Validate AstriaGraph data and importer

on:
  pull_request:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check main.js
          node --check scripts/fetch_celestrak.mjs
      - name: Run CelesTrak validation fixtures
        run: node scripts/test_celestrak.mjs
      - name: Validate checked-in TSV datasets
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            for (const file of ["assets/data/www_query_NODEB.tsv", "assets/data/www_query_DEB.tsv"]) {
              // Split on newlines and drop only empty lines; trimEnd() on the
              // whole blob would also strip a final data row trailing empty
              // tab columns (debris rows have blank OpsStatusCode/ObjectType).
              const lines = fs.readFileSync(file, "utf8").split(/\r?\n/).filter(l => l.length > 0);
               const width = lines[0].split("\t").length;
               const ids = new Set();
               if (width !== 27 || lines.length < 2) throw new Error(`${file}: invalid shape`);
               for (const line of lines.slice(1)) {
                 const cells = line.split("\t");
                 if (cells.length !== width) throw new Error(`${file}: malformed row`);
                 if (cells[0] !== "CELESTRAK") throw new Error(`${file}: provenance mismatch`);
                 if (!cells[4]) throw new Error(`${file}: missing NORAD ID`);
                 if (ids.has(cells[4])) throw new Error(`${file}: duplicate NORAD ID ${cells[4]}`);
                 const numericFields = [4, 19, 20, 21, 22, 23, 24];
                 for (const index of numericFields) {
                   if (!Number.isFinite(Number(cells[index]))) throw new Error(`${file}: invalid numeric field ${index}`);
                 }
                 if (Number(cells[20]) < 0 || Number(cells[20]) >= 1) throw new Error(`${file}: invalid eccentricity`);
                 if (Number(cells[19]) <= 0) throw new Error(`${file}: invalid SMA`);
                 if (Number.isNaN(Date.parse(cells[18]))) throw new Error(`${file}: invalid epoch`);
                 ids.add(cells[4]);
               }
             }
           '
